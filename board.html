<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Glasshouse — Board</title>
  <link rel="stylesheet" href="assets/css/app.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' rx='3' fill='%23190A33'/><text x='8' y='12' font-size='10' text-anchor='middle' fill='%23FF3D8A'>B</text></svg>">
</head>
<body>
  <div class="board-wrap">
    <div class="row" style="align-items:flex-end">
      <div>
        <div class="kicker">Operation Glasshouse</div>
        <h1 style="font-size:40px;margin:0"><span class="lime">LEADER</span><span class="cyan">BOARD</span></h1>
      </div>
      <div class="spacer"></div>
      <div style="text-align:right">
        <div class="kicker">session clock</div>
        <div class="bigclock" id="clock">00:00</div>
      </div>
    </div>

    <div class="row" style="margin:10px 0 18px">
      <span class="pill" id="finished">0 finished</span>
      <span class="pill" id="parpace">par pace loaded</span>
      <div class="spacer"></div>
      <button class="btn small ghost" id="start-clock">start session clock</button>
      <button class="btn small ghost" id="fs">full screen</button>
      <button class="btn small ghost" id="removelast">remove last</button>
      <button class="btn small pink" id="clear">clear board</button>
    </div>

    <div id="rows"></div>
    <p class="small muted" id="empty-note" style="margin-top:20px"></p>
  </div>

  <script src="core/crypto.js"></script>
  <script src="config.js"></script>
  <script src="core/ui.js"></script>
  <script>
    var BOARD_KEY = 'glasshouse.board.v1';
    var CLOCK_KEY = 'glasshouse.sessionStart.v1';

    function getBoard() { try { return JSON.parse(localStorage.getItem(BOARD_KEY) || '[]'); } catch (e) { return []; } }
    function setBoard(b) { try { localStorage.setItem(BOARD_KEY, JSON.stringify(b)); } catch (e) {} }

    function render() {
      var board = getBoard().slice().sort(function (a, b) {
        if (a.elapsedSec !== b.elapsedSec) return a.elapsedSec - b.elapsedSec; // faster first
        return (b.arcade || 0) - (a.arcade || 0);                              // arcade breaks ties
      });
      var rows = document.getElementById('rows');
      UI.clear(rows);
      document.getElementById('finished').textContent = board.length + ' finished';
      var note = document.getElementById('empty-note');

      if (!board.length) {
        note.textContent = 'Waiting for the first finisher. Top five light up as names come in.';
        for (var i = 0; i < 5; i++) {
          rows.appendChild(UI.el('div', { class: 'board-row board-empty p' + (i + 1) }, [
            UI.el('div', { class: 'rank', text: '#' + (i + 1) }),
            UI.el('div', { class: 'name', text: '—' }),
            UI.el('div', { class: 'time', text: '--:--' }),
            UI.el('div', { class: 'pts', text: '' })
          ]));
        }
        return;
      }
      note.textContent = '';
      board.forEach(function (e, i) {
        var cls = 'board-row' + (i < 5 ? ' p' + (i + 1) : '');
        var nameExtra = (e.integrity === 'unverified' ? ' ⚠' : '') + (e.adjustMin ? ' (±' + e.adjustMin + 'm)' : '');
        rows.appendChild(UI.el('div', { class: cls }, [
          UI.el('div', { class: 'rank', text: '#' + (i + 1) }),
          UI.el('div', { class: 'name', text: e.handle + nameExtra }),
          UI.el('div', { class: 'time', text: UI.fmtTime(e.elapsedSec * 1000) }),
          UI.el('div', { class: 'pts', text: (e.arcade || 0) + ' arc' })
        ]));
      });
    }

    function startClock() { localStorage.setItem(CLOCK_KEY, String(Date.now())); }
    function tickClock() {
      var s = localStorage.getItem(CLOCK_KEY);
      var el = document.getElementById('clock');
      if (!s) { el.textContent = '00:00'; return; }
      el.textContent = UI.fmtClock(Date.now() - parseInt(s, 10));
    }

    document.getElementById('start-clock').addEventListener('click', function () { startClock(); tickClock(); });
    document.getElementById('clear').addEventListener('click', function () { if (confirm('Clear the whole board?')) { setBoard([]); render(); } });
    document.getElementById('removelast').addEventListener('click', function () {
      var b = getBoard(); if (!b.length) return;
      b.sort(function (x, y) { return y.at - x.at; }); b.shift(); setBoard(b); render();
    });
    document.getElementById('fs').addEventListener('click', function () {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
      else document.exitFullscreen && document.exitFullscreen();
    });

    // par pace: sum of all scene par times
    var totalPar = 0; Object.keys(Config.PAR).forEach(function (k) { totalPar += Config.PAR[k]; });
    document.getElementById('parpace').textContent = 'full-clear par ' + UI.fmtTime(totalPar * 1000);

    window.addEventListener('storage', render); // live updates when verify.html adds
    setInterval(function () { render(); tickClock(); }, 1000);
    render(); tickClock();
  </script>
</body>
</html>
